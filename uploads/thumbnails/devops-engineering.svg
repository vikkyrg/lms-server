    <text x="110" y="168" font-size="24" letter-spacing="3" fill="#9FB6D4">DEVOPS &amp; SRE</text>

    <text x="110" y="320" font-size="76" font-weight="700" fill="#FFFFFF">DevOps Engineering</text>

    <text x="110" y="440" font-size="26" fill="#C8D7EA">Linux · Docker · Kubernetes · Jenkins · CI/CD</text>
    <text x="110" y="480" font-size="26" fill="#C8D7EA">Terraform · Ansible · AWS · Prometheus &amp; Grafana</text>

    <g>
