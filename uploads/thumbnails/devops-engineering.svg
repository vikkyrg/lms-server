    <line x1="1060" y1="0" x2="1060" y2="720"/>
    <line x1="1200" y1="0" x2="1200" y2="720"/>
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="230" x2="1280" y2="230"/>
    <line x1="0" y1="380" x2="1280" y2="380"/>
