  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <g opacity="0.18" stroke="#F4D36B" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="720"/>
    <line x1="220" y1="0" x2="220" y2="720"/>
    <line x1="360" y1="0" x2="360" y2="720"/>
    <line x1="500" y1="0" x2="500" y2="720"/>
